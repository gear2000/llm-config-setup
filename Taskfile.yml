version: '3'

# llm-config-setup — compose targets only.
# Run `task compose:all` after editing layers to regenerate output files.

tasks:

  # ---------------------------------------------------------------------------
  # compose:* — assemble skills/agents/CLAUDE.md/AGENTS.md from layer files
  # ---------------------------------------------------------------------------

  compose:all:
    desc: "Assemble all CLAUDE.md, AGENTS.md, and skill files from layer files"
    cmds:
      - python3 tools/compose-layers.py

  compose:skill:
    desc: "Assemble one skill (e.g. task compose:skill -- python)"
    cmds:
      - python3 tools/compose-layers.py .shared-llm/compose/skills/{{.CLI_ARGS}}.yaml

  compose:claude-md:
    desc: "Assemble one CLAUDE.md (e.g. task compose:claude-md -- root)"
    cmds:
      - python3 tools/compose-layers.py .shared-llm/compose/claude-md/{{.CLI_ARGS}}.yaml

  compose:agents-md:
    desc: "Assemble one AGENTS.md (e.g. task compose:agents-md -- root)"
    cmds:
      - python3 tools/compose-layers.py .shared-llm/compose/agents-md/{{.CLI_ARGS}}.yaml

  compose:agent:
    desc: "Assemble one agent (e.g. task compose:agent -- architecture)"
    cmds:
      - python3 tools/compose-layers.py .shared-llm/compose/agents/{{.CLI_ARGS}}.yaml

  compose:agents:
    desc: "Assemble every agent recipe under .shared-llm/compose/agents/"
    cmds:
      - for: { var: AGENTS }
        cmd: python3 tools/compose-layers.py .shared-llm/compose/agents/{{.ITEM}}
    vars:
      AGENTS:
        sh: ls -1 .shared-llm/compose/agents/

  # ---------------------------------------------------------------------------
  # install — the headline consumer feature. Two surfaces:
  #   task install local            general/home pieces (all-projects)
  #   task install repo -- <dir=.>  set up a target repo (per-repo pieces)
  #
  # go-task runs `install local` / `install repo` as the `install` guard target
  # followed by the `local` / `repo` worker target, so the invocations read as
  # natural two-word commands.
  # ---------------------------------------------------------------------------

  install:
    desc: "Install entrypoint — run `task install local` or `task install repo -- <dir>`"
    silent: true
    cmds:
      # Runs as the first of two targets in `install local` / `install repo`, and
      # alone for a bare `task install`. The usage hint is harmless before a worker
      # and useful on its own. Workers (local/repo) carry all the real output.
      - 'echo "install: local -> general/home pieces | repo -- <dir> -> set up a target repo"'

  local:
    desc: "Install the general/home pieces: skills, generic agents, pi runtime, ~/.local/bin/llm-compose"
    cmds:
      - bash tools/install-local.sh {{.CLI_ARGS}}

  repo:
    desc: "Set up a target repo (e.g. task install repo -- /path/to/repo); INSTALL_REPO_YES=1 to skip the fill pause"
    cmds:
      - bash tools/install-repo.sh {{.CLI_ARGS}}

  # ---------------------------------------------------------------------------
  # setup:* — wire Pi harness runtime config into ~/.pi/
  # ---------------------------------------------------------------------------

  setup:pi:
    desc: "Symlink this kit's Pi extensions + codex-reviewer agent into ~/.pi and install their npm deps"
    cmds:
      - bash tools/setup-pi.sh

  setup:pi:unlink:
    desc: "Remove the ~/.pi symlinks created by setup:pi (leaves settings.json + installed extensions)"
    cmds:
      - bash tools/setup-pi.sh --unlink

  setup:pi:extensions:
    desc: "Install the pinned third-party Pi extensions from the manifest (idempotent)"
    cmds:
      - bash tools/install-pi-extensions.sh {{.CLI_ARGS}}

  # ---------------------------------------------------------------------------
  # setup:global — compose the GENERAL convention skills and install them into the
  # user's HOME skill dirs (~/.claude, ~/.codex, ~/.pi), global/all-projects.
  # Separate from the per-repo compose; does not touch ~/.claude/CLAUDE.md.
  # ---------------------------------------------------------------------------

  setup:global:
    desc: "Compose the general skills and install them into ~/.claude, ~/.codex, ~/.pi (global, all-projects)"
    cmds:
      - bash tools/install-global.sh

  setup:global:uninstall:
    desc: "Remove only the global skills installed by setup:global (leaves foreign/divergent files)"
    cmds:
      - bash tools/install-global.sh --uninstall

  test:
    desc: "Run the iac-guard classifier unit test (zero deps; Node 22.6+ native type-stripping)"
    cmds:
      - node --experimental-strip-types .shared-llm/llm/pi/common/extensions/iac-guard.test.ts

  test:memsearch:
    desc: "Run the memsearch collection-derivation unit test (zero deps; Node 22.6+ native type-stripping)"
    cmds:
      - node --experimental-strip-types .shared-llm/llm/pi/common/extensions/memsearch.test.ts

  # ---------------------------------------------------------------------------
  # Pi launch group — start & manage the Pi agents (hub + builder). Requires tmux.
  # Named unprefixed so a parent Taskfile imports them cleanly:
  #   includes: { pi: { taskfile: ./Taskfile.yml, dir: . } }   ->   task pi:up
  # Or run directly, no parent edit:   task -d <this-dir> up
  # ---------------------------------------------------------------------------

  up:
    desc: "Bring up the Pi setup: ensure ~/.pi symlinks + the socket hub, then launch the builder"
    deps: [setup:pi]
    cmds:
      - task: hub
      - pi

  hub:
    desc: "Start the codex/iac-verifier socket hub detached in tmux (idempotent)"
    cmds:
      - tmux has-session -t pi-hub 2>/dev/null || tmux new-session -d -s pi-hub 'pi -e ~/.pi/extensions/codex-reviewer-hub.ts'
      - 'echo "pi-hub up — tmux attach -t pi-hub to watch"'

  builder:
    desc: "Launch a builder Pi (iac-guard auto-loads); the hub must be up for gray-zone verdicts"
    cmds:
      - pi

  status:
    desc: "Show hub + socket state"
    cmds:
      - 'tmux has-session -t pi-hub 2>/dev/null && echo "hub: up" || echo "hub: down"'
      - 'test -S ~/.pi/codex-reviewer.sock && echo "socket: present" || echo "socket: absent"'

  clean:
    desc: "Stop the hub and remove stale sockets"
    cmds:
      - tmux kill-session -t pi-hub 2>/dev/null || true
      - rm -f ~/.pi/codex-reviewer.sock
      - 'echo "clean: hub stopped, sockets removed"'
