version: '3'

# Thin compose Taskfile for a repo set up via `task install repo`.
#
# This repo is self-contained: the compose engine lives at tools/harness.py
# and the layer tree at .shared-llm/. These targets drive the engine locally — no
# central engine, no ~/.local/bin/llm-compose dependency (that wrapper also works,
# but is optional).
#
# Recipe `output:` paths are ROOT-RELATIVE, and these targets compose with
# `--target .`, so the generated files land at this repo's root:
#   CLAUDE.md, AGENTS.md, .claude/skills/<name>/SKILL.md, .claude/agents/<name>.md
#
# `compose:all` composes only the CONSUMER-relevant recipe groups — root
# CLAUDE.md/AGENTS.md, skills, and the generic agents. It deliberately does NOT
# compose the home-only `global/` skills (those install into ~/ via
# `task install local`) or the `example-package` / `example-service` DEMO recipes
# (illustrative samples — compose them by hand into a samples/ area if you want to
# see them; they are not consumer deliverables).
#
# After editing any .shared-llm/layers/ prose, run `task compose:all` to regenerate
# the output files. Commit the generated outputs — they are this repo's deliverables.

tasks:

  compose:all:
    desc: "Compose CLAUDE.md, AGENTS.md, skills, and agents to the repo root (consumer recipes only)"
    cmds:
      - python3 tools/harness.py compose --shared-llm .shared-llm --target . .shared-llm/compose/claude-md/root.yaml
      - python3 tools/harness.py compose --shared-llm .shared-llm --target . .shared-llm/compose/agents-md/root.yaml
      - python3 tools/harness.py compose --shared-llm .shared-llm --target . .shared-llm/compose/skills
      - python3 tools/harness.py compose --shared-llm .shared-llm --target . .shared-llm/compose/agents

  compose:claude-md:
    desc: "Assemble one CLAUDE.md to the repo root (e.g. task compose:claude-md -- root)"
    cmds:
      - python3 tools/harness.py compose --shared-llm .shared-llm --target . .shared-llm/compose/claude-md/{{.CLI_ARGS}}.yaml

  compose:agents-md:
    desc: "Assemble one AGENTS.md to the repo root (e.g. task compose:agents-md -- root)"
    cmds:
      - python3 tools/harness.py compose --shared-llm .shared-llm --target . .shared-llm/compose/agents-md/{{.CLI_ARGS}}.yaml

  compose:skill:
    desc: "Assemble one skill to the repo root (e.g. task compose:skill -- python)"
    cmds:
      - python3 tools/harness.py compose --shared-llm .shared-llm --target . .shared-llm/compose/skills/{{.CLI_ARGS}}.yaml

  compose:agent:
    desc: "Assemble one agent persona to the repo root (e.g. task compose:agent -- deployer)"
    cmds:
      - python3 tools/harness.py compose --shared-llm .shared-llm --target . .shared-llm/compose/agents/{{.CLI_ARGS}}.yaml
