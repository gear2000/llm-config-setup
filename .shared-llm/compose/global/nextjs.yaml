# Global (all-projects) Next.js skill recipe.
#
# Same compose mechanism as the per-repo recipes under .shared-llm/compose/skills/ —
# the ONLY difference is intent: this assembles the GENERAL Next.js convention layer
# (no project stub) for installation into the user's HOME skill dirs, where all three
# harnesses (Claude Code, Codex, Pi) read skills globally.
#
# tools/install-global.sh composes this, then copies the staged SKILL.md into
# ~/.claude/skills/nextjs/, ~/.codex/skills/nextjs/, and ~/.pi/skills/nextjs/.
#
# Inputs: ONLY the general layer — practices.md + description.md. No project-specific
# layer, so the global skill carries general App Router conventions only.
#
# Output staging path lives under examples/ (gitignored) because it is a generated
# artifact, not source — the installer copies it into home.
name: nextjs
description: .shared-llm/layers/skills/common/nextjs/description.md
inputs:
  - .shared-llm/layers/skills/common/nextjs/practices.md
output: examples/global-staging/skills/nextjs/SKILL.md
