# Global (all-projects) Python skill recipe.
#
# Same compose mechanism as the per-repo recipes under .shared-llm/compose/skills/ —
# the ONLY difference is intent: this assembles the GENERAL Python convention layer
# (no project/this_repo stub) for installation into the user's HOME skill dirs,
# where all three harnesses (Claude Code, Codex, Pi) read skills globally.
#
# tools/install-global.sh composes this, then copies the staged SKILL.md into
# ~/.claude/skills/python/, ~/.codex/skills/python/, and ~/.pi/agent/skills/python/.
#
# Inputs: ONLY the general layer — practices.md + description.md. Deliberately does
# NOT include .shared-llm/layers/skills/this_repo/python.md (the per-project stub), so the global
# skill carries general conventions only.
#
# Output staging path lives under examples/ (gitignored) because it is a generated
# artifact, not source — the installer copies it into home (a real file, no dangling
# symlink to a generated/ignored path).
name: python
description: .shared-llm/layers/skills/common/python/description.md
inputs:
  - .shared-llm/layers/skills/common/python/practices.md
output: global-staging/skills/python/SKILL.md
