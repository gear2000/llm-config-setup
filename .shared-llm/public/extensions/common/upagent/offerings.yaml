# Canonical public UpAgent offering roster. The stable ids, harnesses, models, and effort
# allowlists are validated against code-owned policy before they can be listed or launched.
schema_version: 1
offerings:
  claude-fable-5:
    harness: claude
    model: claude-fable-5
    efforts: [low, medium, high, xhigh, max]
  claude-sonnet-5:
    harness: claude
    model: claude-sonnet-5
    efforts: [low, medium, high, xhigh, max]
  claude-opus-4-8:
    harness: claude
    model: claude-opus-4-8
    efforts: [low, medium, high, xhigh, max]
  codex-gpt-5-6-sol:
    harness: codex
    model: gpt-5.6-sol
    efforts: [low, medium, high, xhigh, max]
    # codex exec exits when done; no live repair prompt is possible.
    completion_style: exec
  cursor-composer-2-5:
    harness: cursor
    # Composer 2.5, deliberately NOT the -fast variant. Cursor model ids carry
    # their native effort tier, so public cursor offerings expose default only.
    model: composer-2.5
    efforts: [default]
    # Interactive mode preserves Cursor's live TUI and same-worker repair channel.
    completion_style: interactive
  cursor-grok-4-6:
    harness: cursor
    model: cursor-grok-4.6-high
    efforts: [default]
    completion_style: interactive
  cursor-opus-4-6:
    harness: cursor
    model: claude-4.6-opus-high
    efforts: [default]
    completion_style: interactive
  cursor-sonnet-4-6:
    harness: cursor
    model: claude-4.6-sonnet-medium
    efforts: [default]
    completion_style: interactive
  cursor-fable-5:
    harness: cursor
    model: claude-fable-5-high
    efforts: [default]
    completion_style: interactive
  pi-gpt-5-6-sol:
    harness: pi
    model: openai-codex/gpt-5.6-sol
    efforts: [low, medium, high, xhigh, max]
  pi-gpt-5-6-terra:
    harness: pi
    model: openai-codex/gpt-5.6-terra
    efforts: [low, medium, high, xhigh, max]
  pi-gpt-5-6-luna:
    harness: pi
    model: openai-codex/gpt-5.6-luna
    efforts: [low, medium, high, xhigh, max]
  pi-gpt-5-5:
    harness: pi
    model: openai-codex/gpt-5.5
    efforts: [low, medium, high, xhigh]
  pi-gpt-5-4-mini:
    harness: pi
    model: openai-codex/gpt-5.4-mini
    efforts: [low, medium, high, xhigh]
  pi-glm-5-3-flash:
    harness: pi
    model: openrouter/z-ai/glm-5.3-flash
    efforts: [low, high, max]

# Legacy route orders default direct; each public request pins dedicated management. References
# are offering-based so the advisory Account Manager resolves exactly claude-sonnet-5/low with
# upagent-account-manager and cannot escape the approved roster or inject a public-path command.
management:
  mode: direct
  rescue_on_startup_failure: true
  startup_timeout_ms: 45000
  inactivity_check_ms: 900000
  requester_grace_ms: 300000
  account_manager:
    offering: claude-sonnet-5
    effort: low
    agent: upagent-account-manager
    expected_agent: claude
    expected_process: claude
    timeout_ms: 120000
  checker:
    offering: claude-sonnet-5
    effort: low
    agent: upagent-checker
    expected_agent: claude
    expected_process: claude
    timeout_ms: 120000
  # The hub selects the entry opposite the worker offering's pinned provider.
  # The claude sentinel runs the upagent-sentinel persona; the pi renderer carries
  # no persona flag, so the openai sentinel runs persona-less on its self-contained
  # brief (the `agent:` field below is roster bookkeeping, not a pi launch flag).
  sentinels:
    anthropic:
      offering: claude-sonnet-5
      effort: low
      agent: upagent-sentinel
      expected_agent: claude
      expected_process: claude
      timeout_ms: 120000
    openai:
      offering: pi-gpt-5-4-mini
      effort: low
      agent: upagent-sentinel
      expected_agent: pi
      expected_process: pi
      timeout_ms: 120000
