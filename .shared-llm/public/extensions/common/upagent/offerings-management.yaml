# Legacy route orders default direct; each public request pins dedicated management. Candidate
# order is policy owned by this roster, while offerings.py validates every reference and renders
# every command. The public YAML never carries executable commands.
management:
  # False disables status recovery only; Sentinel closeouts still use the shared ladder.
  status_first: true
  mode: direct
  rescue_on_startup_failure: true
  startup_timeout_ms: 45000
  inactivity_check_ms: 900000
  requester_grace_ms: 300000
  # Cursor ignores a prompt in a pane of 6 rows or fewer, and the oversight tab shrinks
  # below that under load. A hired manager or Sentinel has no fallback for later prompts,
  # so Cursor is only the last resort in both seats.
  account_manager:
    candidates:
      - offering: pi-gpt-5-6-luna
        effort: high
      - offering: claude-sonnet-5-5
        effort: medium
      - offering: cursor-composer-2-5
        effort: default
    agent: upagent-account-manager
    timeout_ms: 120000
  checker:
    candidates:
      - offering: claude-sonnet-5-5
        effort: medium
      - offering: pi-gpt-5-6-luna
        effort: high
    agent: upagent-checker
    timeout_ms: 120000
  sentinel:
    candidates:
      - offering: pi-gpt-5-6-luna
        effort: max
      - offering: claude-sonnet-5-5
        effort: medium
      - offering: cursor-composer-2-5
        effort: default
    agent: upagent-sentinel
    timeout_ms: 120000

# Standalone Flow 1 sweeps; false is the rollback switch.
run_watch:
  enabled: true
  interval_minutes: 5
  drain_minutes: 5
