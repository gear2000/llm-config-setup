# specialists.yaml — the kit base specialist roster (public, kit-synced).
#
# A destination overlay at
#   .shared-llm/this_repo/extensions/common/upagent/specialists.yaml
# merges by specialist name on top of this base. Every specialist pins one approved public
# offering and allowed effort; raw harness/model tuples are deliberately not accepted.

specialists:
  - name: backend
    location: .claude/agents/backend.md
    description: "Backend services, APIs, request contracts, tests, and failure diagnosis."
    offering: claude-sonnet-5
    effort: medium
    agent: backend
  - name: frontend
    location: .claude/agents/frontend.md
    description: "Frontend pages, components, routing, data fetching, and accessibility."
    offering: claude-sonnet-5
    effort: medium
    agent: frontend
  - name: reviewer
    location: .claude/agents/reviewer.md
    description: "Independent read-only review with concrete file and evidence citations."
    offering: claude-opus-5
    effort: high
    agent: reviewer
  - name: qa
    location: .claude/agents/qa.md
    description: "Test execution, regression diagnosis, and acceptance evidence."
    offering: claude-sonnet-5
    effort: medium
    agent: qa
  - name: terraform
    location: .claude/agents/terraform.md
    description: "Terraform implementation and plan analysis; apply remains human-gated."
    offering: claude-sonnet-5
    effort: medium
    agent: terraform
  - name: aws
    location: .claude/agents/aws.md
    description: "AWS architecture, IAM, networking, and read-only operational diagnostics."
    offering: claude-sonnet-5
    effort: medium
    agent: aws
  - name: github
    location: .claude/agents/github.md
    description: "GitHub repository, pull request, Actions, and collaboration workflows."
    offering: claude-sonnet-5
    effort: medium
    agent: github
  - name: security
    location: .claude/agents/security.md
    description: "Auth flows, access control, secrets handling, and security review."
    offering: claude-sonnet-5
    effort: medium
    agent: security
  - name: database
    location: .claude/agents/database.md
    description: "Schema design, migrations, and data-access conventions."
    offering: claude-sonnet-5
    effort: medium
    agent: database
  - name: architecture
    location: .claude/agents/architecture.md
    description: "Module boundaries, package scaffolding, and cross-service design decisions."
    offering: claude-sonnet-5
    effort: medium
    agent: architecture
  - name: devops
    location: .claude/agents/devops.md
    description: "Infrastructure-as-code, deployment, containers, and operational tasks."
    offering: claude-sonnet-5
    effort: medium
    agent: devops
  - name: docs
    location: .claude/agents/docs-writer.md
    description: "Documentation structure, docs accuracy against code, and navigation."
    offering: claude-sonnet-5
    effort: medium
    agent: docs-writer
