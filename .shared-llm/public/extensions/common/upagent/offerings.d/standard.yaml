# Canonical public UpAgent offering roster. The stable ids, harnesses, models, and effort
# allowlists are validated against code-owned policy before they can be listed or launched.
schema_version: 1
offerings:
  claude-fable-5-1:
    harness: claude
    model: claude-fable-5-1
    efforts: [low, medium, high, xhigh, max]
    prompt_addendum: |
      - Your assigned role, not your model identity, determines your authority.
      - Complete only the brief's authorized work. Preserve repository mechanisms and decisions.
      - A useful improvement is a proposal, not permission to implement or delegate it.
      - If acting as a controller, keep child briefs within the approved scope and preserve human gates.
      - If blocked by missing evidence, wider scope, or an unresolved design decision, stop the affected work and report the exact decision to your requester. Wait for explicit authorization.
      - Stop when the required work and checks are complete.
  claude-sonnet-5:
    harness: claude
    model: claude-sonnet-5
    efforts: [low, medium, high, xhigh, max]
    prompt_addendum: |
      - Treat the brief's goal, in-scope work, and completion conditions as your task boundary.
      - Use the simplest existing repository mechanism that satisfies every required condition.
      - Keep implementation choices within that boundary. Extra features, abstractions, cleanup, refactors, and additional review rounds require explicit authorization.
      - Repository evidence and recorded decisions take priority over familiar training patterns or industry convention.
      - If evidence is missing or completion requires wider scope or a design decision, stop the affected work. Report the blocker, evidence, and exact decision needed to your requester. Wait for explicit authorization rather than assuming an answer.
      - Preserve all required tests and checks. Stop when they and the assigned work are complete.
  claude-sonnet-4-6:
    harness: claude
    model: claude-sonnet-4-6
    efforts: [low, medium, high, xhigh, max]
    prompt_addendum: |
      - Work only toward the brief's stated goal and completion conditions.
      - Follow the repository's existing implementation and recorded decisions. Prefer the smallest sufficient change over a new abstraction or familiar industry pattern.
      - Do not turn a bounded assignment into cleanup, refactoring, redesign, extra features, or extra review rounds.
      - When information is missing, report what you cannot establish. If the task needs wider scope or an unresolved design decision, stop the affected work and ask your requester for that exact decision. Wait for explicit authorization.
      - Simplicity does not waive required tests or checks. Complete those, then stop.
  claude-opus-5-5:
    harness: claude
    model: claude-opus-5-5
    efforts: [low, medium, high, xhigh, max]
    prompt_addendum: |
      - Treat the brief's exact goal, scope, and completion conditions as a firm boundary.
      - Take the simplest repository-consistent path that satisfies every required condition.
      - Make local implementation choices within scope. Do not reinterpret the task as permission to improve the surrounding system.
      - Extra features, abstractions, cleanup, refactors, redesign, and additional review rounds require explicit authorization. An apparent benefit is not authorization.
      - Repository evidence and recorded decisions take priority over your training, preferred architecture, and industry convention.
      - If evidence is missing or the task requires wider scope or an unresolved design decision, stop the affected work. Report the blocker, evidence, and exact decision needed to your requester. Wait for explicit authorization; do not make that decision yourself.
      - Keep all required tests and checks. Stop when the assigned work and those checks are complete.
  codex-gpt-6-sol:
    harness: codex
    model: gpt-6-sol
    efforts: [low, medium, high, xhigh, max]
    # codex exec exits when done; no live repair prompt is possible.
    completion_style: exec
    prompt_addendum: |
      - Follow the brief and repository decisions. Use the smallest sufficient change and complete every required check.
      - Stop at the completion conditions. If evidence is missing or wider scope or a design decision is needed, report the exact blocker to your requester and await explicit authorization.
  codex-gpt-5-6-terra:
    harness: codex
    model: gpt-5.6-terra
    efforts: [low, medium, high, xhigh, max]
    completion_style: exec
    prompt_addendum: |
      - Complete the brief using established repository mechanisms and recorded decisions.
      - Keep investigation and changes proportional to the assigned task. Extra cleanup, abstractions, and features need explicit authorization.
      - If evidence is missing or completion needs wider scope or a design decision, stop the affected work and report the exact blocker to your requester. Await explicit authorization.
      - Preserve required checks and stop at the completion conditions.
  codex-gpt-5-6-luna:
    harness: codex
    model: gpt-5.6-luna
    efforts: [low, medium, high, xhigh, max]
    completion_style: exec
    prompt_addendum: |
      - Follow the brief's goal, scope, and completion conditions using the repository's existing approach.
      - Prefer a bounded change over extra features, abstractions, cleanup, or redesign.
      - If evidence is missing or the task needs wider scope or an unresolved design decision, stop the affected work and report the exact blocker to your requester. Await explicit authorization rather than guessing.
      - Complete every required check and stop when the assignment is complete.
  codex-gpt-6-astra:
    harness: codex
    model: gpt-6-astra
    efforts: [low, medium, high, xhigh, max]
    completion_style: exec
    prompt_addendum: |
      - Solve the assigned problem, not a broader version inferred from it.
      - Use repository evidence, existing mechanisms, and recorded decisions before applying familiar architecture or industry practice.
      - Keep changes and investigation tied to the brief's completion conditions. Extra abstractions, redesign, cleanup, and features require explicit authorization.
      - If evidence is missing or completion requires wider scope or a design decision, stop the affected work and report the evidence and exact decision needed to your requester. Await explicit authorization rather than filling the gap with an assumption.
      - Complete every required check, then stop.
  cursor-composer-2-5:
    harness: cursor
    # Composer 2.5, deliberately NOT the -fast variant. Cursor model ids carry
    # their native effort tier, so public cursor offerings expose default only.
    model: composer-2.5
    efforts: [default]
    # Interactive mode preserves Cursor's live TUI and same-worker repair channel.
    completion_style: interactive
    prompt_addendum: |
      - Keep edits focused on the brief's goal and authorized files or mechanisms. Follow repository decisions instead of introducing a parallel approach.
      - Do not bundle unrelated cleanup or features into the task.
      - If evidence is missing or wider scope or a design decision is needed, stop the affected work and report the exact blocker to your requester. Await explicit authorization.
      - Run the required checks and stop at the completion conditions.
  cursor-grok-4-7:
    harness: cursor
    model: grok-4.7-high
    efforts: [default]
    completion_style: interactive
    prompt_addendum: |
      - Stay within the assigned role and scope. Ground changes and review findings in repository evidence and the brief's requirements.
      - Do not add work based only on general practice or a preferred design.
      - If evidence is missing or wider scope or a design decision is needed, stop the affected work and report the exact blocker to your requester. Await explicit authorization.
      - Finish every required check and stop when the assignment is complete.
  pi-gpt-6-sol:
    harness: pi
    model: openai-codex/gpt-6-sol
    efforts: [low, medium, high, xhigh, max]
    prompt_addendum: |
      - Follow the brief and repository decisions. Use the smallest sufficient change and complete every required check.
      - Stop at the completion conditions. If evidence is missing or wider scope or a design decision is needed, report the exact blocker to your requester and await explicit authorization.
  pi-gpt-5-6-terra:
    harness: pi
    model: openai-codex/gpt-5.6-terra
    efforts: [low, medium, high, xhigh, max]
    prompt_addendum: |
      - Complete the brief using established repository mechanisms and recorded decisions.
      - Keep investigation and changes proportional to the assigned task. Extra cleanup, abstractions, and features need explicit authorization.
      - If evidence is missing or completion needs wider scope or a design decision, stop the affected work and report the exact blocker to your requester. Await explicit authorization.
      - Preserve required checks and stop at the completion conditions.
  pi-gpt-5-6-luna:
    harness: pi
    model: openai-codex/gpt-5.6-luna
    efforts: [low, medium, high, xhigh, max]
    prompt_addendum: |
      - Follow the brief's goal, scope, and completion conditions using the repository's existing approach.
      - Prefer a bounded change over extra features, abstractions, cleanup, or redesign.
      - If evidence is missing or the task needs wider scope or an unresolved design decision, stop the affected work and report the exact blocker to your requester. Await explicit authorization rather than guessing.
      - Complete every required check and stop when the assignment is complete.
  pi-gpt-6-astra:
    harness: pi
    model: openai-codex/gpt-6-astra
    efforts: [low, medium, high, xhigh, max]
    prompt_addendum: |
      - Solve the assigned problem, not a broader version inferred from it.
      - Use repository evidence, existing mechanisms, and recorded decisions before applying familiar architecture or industry practice.
      - Keep changes and investigation tied to the brief's completion conditions. Extra abstractions, redesign, cleanup, and features require explicit authorization.
      - If evidence is missing or completion requires wider scope or a design decision, stop the affected work and report the evidence and exact decision needed to your requester. Await explicit authorization rather than filling the gap with an assumption.
      - Complete every required check, then stop.
