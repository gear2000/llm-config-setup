# agents.yaml — the KIT BASE Specialist Hub roster (public, kit-synced).
#
# This file ships with the engine into every destination at
#   .shared-llm/public/extensions/common/specialist/agents.yaml
# and is ALWAYS loaded. A destination's own roster at
#   .shared-llm/this_repo/extensions/common/specialist/agents.yaml
# merges ON TOP of it: a same-named entry there clobbers the base entry, new entries
# are added, and both sets are available for runs. $SPECIALIST_HUB_CONFIG bypasses the
# merge entirely (single-file override).
#
# Do not edit this copy in a destination — it is regenerated by `just update`. Add or
# override specialists in your `this_repo` roster instead (template: agents.yml.sample).
# Models here are public Claude aliases so every entry launches anywhere Claude Code is
# installed; override per name when your repo routes differently.

agents:
  - name: backend
    location: .claude/agents/backend.md
    description: "Backend services, APIs, request contracts, tests, and failure diagnosis."
    harness: claude
    model: sonnet
    agent: backend
  - name: frontend
    location: .claude/agents/frontend.md
    description: "Frontend pages, components, routing, data fetching, and accessibility."
    harness: claude
    model: sonnet
    agent: frontend
  - name: reviewer
    location: .claude/agents/reviewer.md
    description: "Independent read-only review with concrete file and evidence citations."
    harness: claude
    model: opus
    agent: reviewer
    effort: high
  - name: qa
    location: .claude/agents/qa.md
    description: "Test execution, regression diagnosis, and acceptance evidence."
    harness: claude
    model: sonnet
    agent: qa
  - name: terraform
    location: .claude/agents/terraform.md
    description: "Terraform implementation and plan analysis; apply remains human-gated."
    harness: claude
    model: sonnet
    agent: terraform
  - name: aws
    location: .claude/agents/aws.md
    description: "AWS architecture, IAM, networking, and read-only operational diagnostics."
    harness: claude
    model: sonnet
    agent: aws
  - name: github
    location: .claude/agents/github.md
    description: "GitHub repository, pull request, Actions, and collaboration workflows."
    harness: claude
    model: sonnet
    agent: github
  - name: security
    location: .claude/agents/security.md
    description: "Auth flows, access control, secrets handling, and security review."
    harness: claude
    model: sonnet
    agent: security
  - name: database
    location: .claude/agents/database.md
    description: "Schema design, migrations, and data-access conventions."
    harness: claude
    model: sonnet
    agent: database
  - name: architecture
    location: .claude/agents/architecture.md
    description: "Module boundaries, package scaffolding, and cross-service design decisions."
    harness: claude
    model: sonnet
    agent: architecture
  - name: devops
    location: .claude/agents/devops.md
    description: "Infrastructure-as-code, deployment, containers, and operational tasks."
    harness: claude
    model: sonnet
    agent: devops
  - name: docs
    location: .claude/agents/docs-writer.md
    description: "Documentation structure, docs accuracy against code, and navigation."
    harness: claude
    model: sonnet
    agent: docs-writer
