# Global (all-projects) Go skill recipe.
#
# Installs general Go conventions into the user's HOME skill dirs so all
# harnesses (Claude Code, Codex, Pi) pick them up globally.
#
# tools/install-global.sh composes this, then copies the staged SKILL.md into
# ~/.claude/skills/golang/, ~/.codex/skills/golang/, and ~/.pi/agent/skills/golang/.
#
# Inputs: ONLY the general layer — practices.md + description.md. No per-project
# stub, so the global skill carries general conventions only.
name: golang
description: .shared-llm/public/layers/skills/common/golang/description.md
inputs:
  - .shared-llm/public/layers/skills/common/golang/practices.md
output: global-staging/skills/golang/SKILL.md
